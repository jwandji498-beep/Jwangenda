<style>

<script>

pvx|Cet agenda ne collecte aucune donnée personnelle : il n'y a ni compte, ni serveur, ni base de données.¶Tes événements, devoirs, matières et notes sont enregistrés uniquement dans le stockage local de ton navigateur (localStorage), sur ton appareil. L'éditeur ne peut ni les lire ni les récupérer.¶Aucun cookie, aucun outil de mesure d'audience et aucun traceur publicitaire ne sont utilisés, et rien n'est transmis à des tiers.¶Pour effacer tes données : supprime les éléments dans l'agenda ou vide les données du site dans les réglages de ton navigateur. Tu exerces ainsi directement tes droits d'accès, de rectification et de suppression (RGPD).¶L'hébergeur de la page peut enregistrer des données techniques (comme l'adresse IP) selon sa propre politique.¶Éditeur : Junior Wandji.|This planner collects no personal data: there is no account, server or database.¶Your events, homework, subjects and notes are saved only in your browser's local storage (localStorage), on your device. The publisher can neither read nor retrieve them.¶No cookies, analytics or advertising trackers are used, and nothing is shared with third parties.¶To erase your data: delete items in the planner or clear the site data in your browser settings. This lets you exercise your rights of access, rectification and erasure (GDPR) directly.¶The page host may log technical data (such as the IP address) under its own policy.¶Publisher: Junior Wandji.
cgx|En utilisant cet agenda, tu acceptes ces conditions.¶Service : un agenda étudiant gratuit (calendrier, devoirs, examens, emploi du temps, Pomodoro, notes), fourni tel quel, sans garantie de disponibilité ni d'absence d'erreurs.¶Tes données sont stockées sur ton appareil : si tu vides ton navigateur ou changes d'appareil, elles peuvent être perdues. L'éditeur n'est pas responsable d'une perte de données ni des décisions prises à partir de l'agenda (dates d'examen, échéances).¶Tu t'engages à ne pas détourner le site ni tenter de le perturber.¶Le site et son design appartiennent à Junior Wandji. Ces conditions peuvent évoluer ; la version affichée fait foi.|By using this planner, you accept these terms.¶Service: a free student planner (calendar, homework, exams, timetable, Pomodoro, notes), provided as is, with no guarantee of availability or of being error-free.¶Your data is stored on your device: if you clear your browser or switch devices, it may be lost. The publisher is not liable for data loss or for decisions based on the planner (exam dates, deadlines).¶You agree not to misuse or disrupt the site.¶The site and its design belong to Junior Wandji. These terms may change; the version shown prevails.`.split('\n'),T={fr:{},en:{}};
D.forEach(l=>{const[a,b,c]=l.split('|');T.fr[a]=b;T.en[a]=c});
const TC={cours:'#007A5E',exam:'#CE1126',rev:'#d4a900',rdv:'#3b82f6',perso:'#a855f7'},PI={h:'🔴',m:'🟠',l:'🟢'};

let S={l:'fr',th:'',ev:[],hw:[],sc:[],note:'',sub:[{id:1,n:'Mathématiques',c:'#007A5E'},{id:2,n:'Informatique',c:'#CE1126'},{id:3,n:'Anglais',c:'#d4a900'}]};
try{Object.assign(S,JSON.parse(localStorage.getItem('agenda-cm')||'{}'))}catch(e){}

const ink=c=>{const[r,g,b]=[1,3,5].map(i=>parseInt(c.substr(i,2),16));return r*.299+g*.587+b*.114>150?"#111":"#fff"};
const ts=m=>{const e=$("#ts");e.textContent=m;e.hidden=false;clearTimeout(ts.t);ts.t=setTimeout(()=>e.hidden=true,3500)};

const srt=(a,k)=>a.slice().sort((x,y)=>(x[k]+(x.h||'')).localeCompare(y[k]+(y.h||'')));
const wk=f=>[0,1,2,3,4,5,6].map(i=>new Date(2024,0,1+i).toLocaleDateString(L,{weekday:f}));

$('#bl').textContent=L=='fr'?'EN':'FR';pd()}
function R(){
const td=iso(new Date()),ex=srt(S.ev.filter(e=>e.ty=='exam'&&e.d>=td),'d'),y=M.getFullYear(),m=M.getMonth();
$('#s1').textContent=S.ev.length;$('#s2').textContent=S.ev.filter(e=>e.done).length+S.hw.filter(e=>e.done).length;$('#s3').textContent=ex.length;

$('#dl').innerHTML=`<h3>${fd(sel)}</h3>`+E(srt(S.ev.filter(e=>e.d==sel),'d'));
